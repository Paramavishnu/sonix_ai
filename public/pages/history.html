<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>History — SONIXAI</title>
<link rel="stylesheet" href="/css/theme.css"/><link rel="stylesheet" href="/css/components.css"/>
</head><body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo" style="margin-bottom:16px"><span class="logo-mark">S</span> SONIXAI</div>
    <a href="/pages/dashboard.html">🏠 Dashboard</a>
    <a href="/pages/create.html">✨ Create</a>
    <a href="/pages/projects.html">📁 Projects</a>
    <a class="active" href="/pages/history.html">🕘 History</a>
    <a href="/pages/editor.html">🎬 Editor</a>
    <a href="/pages/settings.html">⚙️ Settings</a>
  </aside>
  <main class="main">
    <h2>Prompt & Script History</h2>
    <div style="display:flex;gap:8px;margin-top:12px">
      <input id="newPrompt" class="input" placeholder="Add prompt/script..."/>
      <select id="ptype" class="select" style="width:160px"><option value="script">script</option><option value="translation">translation</option><option value="thumbnail">thumbnail</option></select>
      <button id="addBtn" class="btn btn-primary">Add</button>
    </div>
    <div id="list" class="grid" style="margin-top:16px"></div>
  </main>
</div>
<script type="module">
import { api, toast } from '/js/core/app.js';
async function load(){
  try{
    const {prompts}=await api('/api/prompts');
    const el=document.getElementById('list');
    if(!prompts.length) el.innerHTML='<div class="empty">No prompts yet</div>';
    else el.innerHTML=prompts.map(p=>`
      <div class="card" style="display:flex;justify-content:space-between;gap:12px;align-items:center">
        <div><div style="font-size:14px">${p.content.slice(0,120)}</div><div style="font-size:12px;color:var(--muted)">${p.type} • ${new Date(p.createdAt).toLocaleString()}</div></div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost" data-copy="${p.id}">Copy</button>
          <button class="btn btn-ghost" data-reuse="${p.id}">Reuse</button>
          <button class="btn btn-ghost" data-del="${p.id}" style="color:#ef4444">Delete</button>
        </div>
      </div>`).join('');
    el.querySelectorAll('[data-copy]').forEach(b=> b.addEventListener('click',()=>{
      const p=prompts.find(x=>x.id===b.dataset.copy); navigator.clipboard.writeText(p.content); toast('Copied','success');
    }));
    el.querySelectorAll('[data-reuse]').forEach(b=> b.addEventListener('click',()=>{
      const p=prompts.find(x=>x.id===b.dataset.reuse); localStorage.setItem('sonix_reuse', p.content); location.href='/pages/create.html';
    }));
    el.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', async()=>{
      await api('/api/prompts/'+b.dataset.del,{method:'DELETE'}); toast('Deleted','success'); load();
    }));
  }catch(e){ document.getElementById('list').innerHTML='<div class="empty">History empty (demo)</div>'; }
}
document.getElementById('addBtn').addEventListener('click', async()=>{
  const c=document.getElementById('newPrompt').value.trim(); if(!c) return toast('Content required','error');
  await api('/api/prompts',{method:'POST', body: JSON.stringify({ content: c, type: document.getElementById('ptype').value })}); toast('Added','success'); document.getElementById('newPrompt').value=''; load();
});
load();
</script>
</body></html>
